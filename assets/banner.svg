<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-label="Louis Miguel Caballero banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111b2e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#3b82f6"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M30 0H0V30" fill="none" stroke="#1b2740" stroke-width="1"/>
    </pattern>
    <clipPath id="card"><rect x="1" y="1" width="998" height="298" rx="18"/></clipPath>
    <clipPath id="av"><circle cx="850" cy="150" r="62"/></clipPath>
  </defs>
  <rect x="1" y="1" width="998" height="298" rx="18" fill="url(#bg)"/>
  <g clip-path="url(#card)">
    <rect width="1000" height="300" fill="url(#grid)" opacity="0.6"/>
    <circle cx="850" cy="150" r="170" fill="url(#glow)"/>
  </g>
  <rect x="1" y="1" width="998" height="298" rx="18" fill="none" stroke="#25324d"/>

  <circle cx="34" cy="32" r="6" fill="#ff5f56"/>
  <circle cx="54" cy="32" r="6" fill="#ffbd2e"/>
  <circle cx="74" cy="32" r="6" fill="#27c93f"/>
  <text x="100" y="36" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="12" fill="#5b6b8c">~/portfolio — zsh</text>

  <text x="50" y="100" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#27c93f">$ <tspan fill="#8aa0c4">whoami</tspan></text>
  <text x="48" y="160" font-family="'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="50" font-weight="800" fill="#f1f5f9" letter-spacing="-1">Louis Miguel Caballero<tspan fill="#22d3ee">.</tspan></text>
  <rect x="50" y="178" width="64" height="4" rx="2" fill="url(#ring)"/>
  <text x="50" y="216" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="18" fill="#22d3ee">Front-End <tspan fill="#5b6b8c">&amp;</tspan> Back-End Developer</text>
  <text x="50" y="244" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#8aa0c4">React · Node.js · MongoDB<tspan fill="#22d3ee">▍</tspan></text>

  <circle cx="850" cy="150" r="100" fill="none" stroke="#25324d" stroke-width="1"/>
  <circle cx="850" cy="150" r="130" fill="none" stroke="#25324d" stroke-width="1" stroke-dasharray="2 6"/>
  <circle cx="850" cy="50" r="6" fill="#22d3ee"/>
  <circle cx="950" cy="150" r="5" fill="#3b82f6"/>
  <circle cx="750" cy="150" r="5" fill="#27c93f"/>
  <circle cx="800" cy="245" r="4" fill="#3b82f6"/>
  <text x="705" y="92" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#3b82f6" opacity="0.8">{ }</text>
  <text x="918" y="86" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="20" fill="#22d3ee" opacity="0.8">&lt;/&gt;</text>
  <text x="905" y="250" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="22" fill="#27c93f" opacity="0.8">;</text>

  <circle cx="850" cy="150" r="68" fill="none" stroke="url(#ring)" stroke-width="4"/>
  <image href="data:image/jpeg;base64," x="788" y="88" width="124" height="124" clip-path="url(#av)" preserveAspectRatio="xMidYMid slice"/>
</svg>